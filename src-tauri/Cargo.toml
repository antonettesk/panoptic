[package]
name = "panoptic"
version = "0.1.0"
description = "Cross-Platform Threat Hunting Tool"
authors = ["Panoptic Core Team"]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
panoptic-core = { path = "../crates/panoptic-core" }
